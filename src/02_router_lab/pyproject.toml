[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "router-lab"
version = "0.3.0"
description = "Single-agent routing experiments for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.5,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
router-eval = "router_lab.eval_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["router_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
